name: 编译蓝牙接收器固件

on:
  workflow_dispatch:
  push:
    paths:
      - "蓝牙接收器/源码/**"
      - ".github/workflows/蓝牙接收器编译.yml"

permissions:
  contents: write   # 编好的固件要存回仓库

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: espressif/idf:v6.1
    steps:
      - uses: actions/checkout@v7

      - name: 编译
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          source "$IDF_PATH/export.sh" > /dev/null
          bash 蓝牙接收器/源码/build.sh

      - uses: actions/upload-artifact@v7
        with:
          name: bluetooth-firmware-${{ github.run_number }}
          path: 蓝牙接收器/源码/out/
          if-no-files-found: error

      - name: 把编好的固件存进仓库（蓝牙接收器/成品/待测-蓝牙接收器.bin）
        shell: bash
        run: |
          set -e
          out=蓝牙接收器/源码/out
          mkdir -p 蓝牙接收器/成品
          cp "$out/ble-hci-dongle-merged.bin" "蓝牙接收器/成品/待测-蓝牙接收器.bin"
          cp "$out/BUILD_INFO.txt" "蓝牙接收器/成品/待测-蓝牙接收器-编译信息.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 蓝牙接收器/成品
          if git diff --cached --quiet; then echo "没有新内容"; exit 0; fi
          git commit -m "蓝牙接收器：存入自动编译的待测固件 [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            sleep 5
          done
          exit 1
