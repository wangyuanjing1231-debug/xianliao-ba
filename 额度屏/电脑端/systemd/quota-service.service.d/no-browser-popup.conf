[Service]
# 防 agy 再往桌面 Chrome 弹登录页（只对 quota-service 这一个服务生效）：
# 1) BROWSER 指向记录脚本（2026-10-23 实证 agy 不认这个，留着无害）；
# 2) PATH 最前面放 browser-shim：xdg-open/google-chrome 等开浏览器命令先撞到记录脚本，只记链接不开页；
# 3) DISPLAY 置空：就算它绕开命令名直接找显示屏，也够不着桌面。
# 撤法：删掉这个文件，systemctl --user daemon-reload && systemctl --user restart quota-service
Environment="BROWSER=/home/yjw/quota-service/record-login-link.sh"
Environment="PATH=/home/yjw/quota-service/browser-shim:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/games:/usr/local/games:/snap/bin"
Environment="DISPLAY="
